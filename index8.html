<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест-драйв Toyota</title>
    <style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background-color: #ffffff;
    
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

.cont100 {
    width: 100%;
    max-width: 900px;
    background: #ffffff;
    padding: 40px 20px;
}

.text100 {
    color: #333333;
}

.main-title {
    font-size: 28px;
    font-weight: 400;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 40px;
}

.subtitle {
    font-size: 14px;
    margin-bottom: 25px;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: 30px;
    row-gap: 20px;
}

.full-width {
    grid-column: span 2;
}


.form-group {
    display: flex;
    flex-direction: column;
}

.field-label {
    font-size: 14px;
    margin-bottom: 8px;
}

input[type="text"],
input[type="email"],
input[type="tel"],
select {
    width: 100%;
    height: 45px;
    background-color: #f0f2f5;
    border: none;
    padding: 0 15px;
    font-size: 15px;
    color: #333333;
    outline: none;
    appearance: none; 
    -webkit-appearance: none;
    -moz-appearance: none;
}

.select-wrapper {
    position: relative;
}

.select-wrapper::after {
    content: '➔';
    font-size: 12px;
    color: #cc0000; 
    transform: rotate(90deg);
    position: absolute;
    right: 15px;
    top: 15px;
    pointer-events: none;
}

.checkbox-group {
    flex-direction: row;
    align-items: center;
    margin-top: 15px;
}

.checkbox-group input[type="checkbox"] {
    width: 18px;
    height: 18px;
    margin-right: 12px;
    cursor: pointer;
}

.checkbox-label {
    font-size: 13px;
    cursor: pointer;
}

.button-group {
    display: flex;
    justify-content: flex-end;
    gap: 20px;
    margin-top: 30px;
}

button {
    height: 45px;
    padding: 0 35px;
    font-size: 16px;
    cursor: pointer;
    border: none;
    transition:  0.2s ease;
}

.btn-clear {
    background-color: transparent;
    color: #333333;
}

.btn-clear:hover {
    text-decoration: underline;
}

.btn-submit {
    background-color: #000000;
    color: #ffffff;
    font-weight: bold;
}

.btn-submit:hover {
    background-color: #222222;
}

html{
    scroll-behavior: smooth;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    color: #292b32;
}

.cont1 {
    width: 100%;
    height: 78px;
    display: flex;
    align-items: center;
    border-bottom: 1px solid #ddd;
    background: white;
    position: relative;
    z-index: 10;
}

.cont2 {
    width: 105px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.photo1 {
    width: 40px;
}

.cont3 {
    height: 100%;
    display: flex;
    align-items: center;
    gap: 29px;
    transition: transform 0.8s ease;
}

.cont3 :hover{
    cursor: pointer;
    border-radius: 10px;
    height: 50px;
    transform: scale(1.07);
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

.text1 {
    height: 100%;
    display: flex;
    align-items: center;
    text-decoration: none;
    color: #303039;
    font-size: 18px;
    white-space: nowrap;
}

.text1 span {
    margin-left: 8px;
}


.cont4 {
    margin-left: auto;
    padding-right: 28px;
    display: flex;
    align-items: center;
    gap: 12px;
}

.text3 {
    font-size: 25px;
}

.text4 {
    font-size: 17px;
}

.text5 {
    margin-left: 22px;
    font-size: 29px;
}

.cont03{
    display: flex;
    margin-top: 20px;
    margin-left: 110px;
    gap: 120px;
}

    </style>
</head>
<body>
     <header class="cont1">
    <div class="cont2">
         <a href="index.html"> <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTHugkOEDGlLx-1yEb-uw-UmYcuyOI5p6AoqsKBSwrIuQ&s=10" class="photo1"> </a> 
    </div>
    <div class="cont3">
        <a href="#modeli" class="text1">Модели</a>
        <a href="images/index2.html" class="text1">
            Авто с пробегом
        </a>
        <a href="index3.html" class="text1">Trade-in</a>
        <a href="index4.html" class="text1 text2">
            Финансы и страхование
        </a>
        <a href="index5.html" class="text1">Сервис</a>
        <a href="index6.html" class="text1">Бизнес</a>
        <a href="index7.html" class="text1">Мир Toyota</a>
    </div>
    <div class="cont4">
        <span class="text3">◎</span>
        <span class="text4">
            <select style="border: none;">
                <option value="">RU</option>
                <option value="">KAZ</option>
            </select>
        </span>
        <span class="text5">⌕</span>
    </div>
</header>

    <div class="cont100">
        <h1 class="text100 main-title">БЕСПЛАТНО ПРОТЕСТИРУЙТЕ АВТОМОБИЛЬ TOYOTA</h1>
        
        <p class="text100 subtitle">Пожалуйста, заполните все поля, отмеченные *</p>

        <form action="#" method="POST" class="form-grid">
            
            <div class="form-group full-width">
                <label class="text100 field-label">Тип запроса *</label>
                <div class="select-wrapper">
                    <select required>
                        <option value="test-drive">Тест-драйв</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label class="text100 field-label">Имя и Фамилия *</label>
                <input type="text" required>
            </div>

            <div class="form-group">
                <label class="text100 field-label">Email адрес</label>
                <input type="email">
            </div>

            <div class="form-group">
                <label class="text100 field-label">Телефон *</label>
                <input type="tel" value="+7" required>
            </div>

            <div class="form-group">
                <label class="text100 field-label">Интересующая модель *</label>
                <div class="select-wrapper">
                    <select required>
                        <option value="" disabled selected>Выберите модель</option>
                        <option value="camry">Toyota Camry</option>
                        <option value="rav4">Toyota RAV4</option>
                        <option value="lc300">Land Cruiser 300</option>
                    </select>
                </div>
            </div>

       
            <div class="form-group">
                <label class="text100 field-label">Город *</label>
                <div class="select-wrapper">
                    <select required>
                        <option value="" disabled selected>Выбрать</option>
                        <option value="almaty">Алматы</option>
                        <option value="astana">Астана</option>
                        <option value="shymkent">Шымкент</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label class="text100 field-label">Дилер *</label>
                <div class="select-wrapper">
                    <select required>
                        <option value="" disabled selected>Выберите дилера</option>
                        <option value="diler1">Тойота Центр</option>
                    </select>
                </div>
            </div>

          
            <div class="form-group full-width checkbox-group">
                <input type="checkbox" id="agreement" required>
                <label for="agreement" class="text100 checkbox-label">
                    Согласие на сбор, обработку и хранение персональных данных *
                </label>
            </div>

        
            <div class="form-group full-width button-group">
                <button type="reset" class="text100 btn-clear">Очистить</button>
                <button type="submit" class="text100 btn-submit">Отправить</button>
            </div>

        </form>
    </div>

</body>
</html>
